name: "🐛 Bug Report"
description: File a bug report to help us improve Bit Manipulators projects
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report an issue! Please provide as much detail as possible.
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
      placeholder: Describe what happened...
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: How can maintainers reproduce this issue?
      placeholder: |
        1. Run '...'
        2. Click on '....'
        3. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment & Platform
      description: OS version, device model, Android API level, Flutter/Python version, etc.
      placeholder: e.g. Ubuntu 24.04 (Wayland), Android 14 (API 34), Flutter 3.24
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Logs / Stack Traces / Screenshots
      description: Paste any error outputs or attach screenshots.
      render: shell
    validations:
      required: false
